name: End-to-end tests

# A real wp_mail(), through the plugin, into a Mailpit mailbox on the same
# Docker network as the wp-env. It is the only suite that walks the whole chain
# — config → phpmailer_init → SMTP → mailbox — and the one that counts when the
# others say yes. Then the same site converted to a network for the multisite
# suite: it goes last because converting it is destructive.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (Mailpit) + multisite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Start wp-env
        run: npx wp-env start

      - name: End-to-end (single site, Mailpit)
        run: tests/e2e/run.sh

      - name: Multisite
        run: tests/e2e/multisite.sh

      - name: Stop wp-env
        if: always()
        run: npx wp-env stop
