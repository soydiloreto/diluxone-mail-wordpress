name: i18n validation

# Validates the plugin's translation strings: extracts a .pot via
# `wp i18n make-pot`, captures the output, and fails the build if any
# "Warning:" or "Error:" lines appear (e.g. missing translator
# comments on sprintf placeholders, dynamic text domains, concat of
# translatable parts). Then sanity-checks that the generated file is
# non-empty.
#
# WordPress Plugin Check (.github/workflows/pr-checks.yml) already
# enforces a subset of i18n rules at PHPCS time. This workflow adds
# the WP-CLI i18n linter, which catches a different (and overlapping)
# set of issues — together they form a fairly tight i18n net.
#
# It then compiles the translations that actually ship. That half was
# missing until a malformed header line in the es_AR .po — a "\n" that
# had been typed as a real newline — travelled all the way to a green
# build: `wp i18n make-mo` swallowed it, and only msgfmt objected.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  i18n:
    name: WP-CLI i18n make-pot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2, wp-cli

      - name: Run wp i18n make-pot
        id: makepot
        # --exclude: skip dev/test/vendor directories — only validate
        #   the code that actually ships in the wp.org plugin.
        # We capture all output so the next step can decide whether
        # warnings fail the build (WP-CLI itself does not have a
        # `--strict` flag — extraction warnings print to stderr but
        # don't change the exit code).
        run: |
          mkdir -p build
          set +e
          OUTPUT=$(wp i18n make-pot . languages/diluxone-mail.pot \
            --slug=diluxone-mail \
            --domain=diluxone-mail \
            --exclude=tests,vendor,node_modules,.wordpress-org,assets,docs,build,tools 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          {
            echo 'output<<EOF_DELIM'
            echo "$OUTPUT"
            echo 'EOF_DELIM'
          } >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      - name: Fail on extraction warnings
        # Any "Warning:" line in `wp i18n make-pot` output indicates a
        # missing translator comment, dynamic text domain, concat'd
        # translatable strings, or similar — all real i18n bugs that
        # WP-CLI prints but does not exit non-zero on.
        env:
          MAKEPOT_OUTPUT: ${{ steps.makepot.outputs.output }}
        run: |
          if printf '%s\n' "$MAKEPOT_OUTPUT" | grep -E '^(Warning|Error):' >&2; then
            echo "::error::wp i18n make-pot reported warnings/errors above."
            exit 1
          fi
          echo "No i18n extraction warnings."

      - name: Verify .pot is non-empty
        # An empty .pot is a strong sign the extraction misfired (e.g.
        # the WP-CLI scanner ignored every PHP file in the project).
        run: |
          set -e
          POT_FILE=languages/diluxone-mail.pot
          if [ ! -s "$POT_FILE" ]; then
            echo "::error::POT file is missing or empty: $POT_FILE"
            exit 1
          fi
          MSGID_COUNT=$(grep -c '^msgid "' "$POT_FILE" || true)
          echo "Extracted $MSGID_COUNT msgid entries."
          # Header counts as one msgid; require >1 so we know real
          # strings were extracted.
          if [ "$MSGID_COUNT" -le 1 ]; then
            echo "::error::POT file extracted no translatable strings."
            exit 1
          fi

      - name: Compile the shipped translations
        # Every .po in languages/ has to compile, and has to compile clean.
        # A fuzzy entry is one gettext does not trust: WordPress silently
        # ignores it and the string comes out in English, which looks exactly
        # like a missing translation and is far harder to find later.
        run: |
          set -e
          sudo apt-get install -y --no-install-recommends gettext > /dev/null

          shopt -s nullglob
          PO_FILES=(languages/*.po)

          if [ ${#PO_FILES[@]} -eq 0 ]; then
            echo "No .po files to compile."
            exit 0
          fi

          FAILED=0

          for PO in "${PO_FILES[@]}"; do
            echo "── $PO"

            if ! msgfmt --check --statistics -o /dev/null "$PO"; then
              echo "::error file=$PO::does not compile."
              FAILED=1
              continue
            fi

            # msgattrib prints the header entry alongside the matches, so an
            # empty result is one msgid and a real hit is two or more.
            FUZZY=$(msgattrib --only-fuzzy --no-obsolete "$PO" | grep -c '^msgid "' || true)
            FUZZY=$(( FUZZY > 0 ? FUZZY - 1 : 0 ))

            if [ "$FUZZY" -gt 0 ]; then
              echo "::error file=$PO::has $FUZZY fuzzy entries; WordPress will show those strings untranslated."
              FAILED=1
            fi
          done

          exit "$FAILED"

      - name: Upload .pot artefact
        uses: actions/upload-artifact@v7
        with:
          name: diluxone-mail-pot
          path: languages/diluxone-mail.pot
          retention-days: 14
